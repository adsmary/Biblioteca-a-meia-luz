<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16162A">
<title>Biblioteca à Meia Luz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
/* ===== DESIGN SYSTEM ===== */
:root{--bg:#1A1A2E;--side:#16162A;--card:#202038;--gold:#D4AF37;--tx:#F5F5F0;--mut:#9C9CAA;--line:rgba(245,245,240,.08);--sw:240px;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:400 14px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
body.col{--sw:72px}
h1,h2,h3,.pf2{font-family:'Playfair Display',Georgia,serif;font-weight:600}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.mut{color:var(--mut)}.gold{color:var(--gold)}
.eb{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
/* sidebar */
.side{position:fixed;inset:0 auto 0 0;width:var(--sw);background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:6;transition:width .25s}
.lg{height:80px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line)}
.lgi{width:40px;height:40px;border:1px solid rgba(212,175,55,.5);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--gold);background:rgba(212,175,55,.08);flex:none}
.lgt b{display:block;font:600 17px/1.1 'Playfair Display',serif}.lgt small{font-size:10px;letter-spacing:.2em;color:var(--mut)}
.mod{padding:24px 20px 8px;font-size:11px;letter-spacing:.16em;font-weight:600;color:var(--mut)}
nav{padding:0 10px;flex:1;overflow:auto}
.nav{display:flex;align-items:center;gap:14px;width:100%;padding:12px 12px;border-radius:10px;color:var(--mut);margin-bottom:2px;transition:.2s;text-align:left;font-weight:500;font-size:15px}
.nav:hover{background:rgba(255,255,255,.04);color:var(--tx)}
.nav.on{background:rgba(255,255,255,.06);color:var(--tx);box-shadow:inset 3px 0 0 var(--gold)}
.nav.on .i{color:var(--gold)}
.fo{padding:12px 10px;border-top:1px solid var(--line)}
body.col .lgt,body.col .nav span,body.col .mod{display:none}body.col .nav,body.col .lg{justify-content:center;padding-left:0;padding-right:0}
/* header */
.hd{position:fixed;top:0;left:var(--sw);right:0;height:80px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(26,26,46,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5;transition:left .25s}
.ht{display:flex;align-items:center;gap:12px;min-width:0}.ht h2{font-size:24px;white-space:nowrap}.ht .i{color:var(--mut)}
.hr{display:flex;gap:12px;align-items:center}
.sr{position:relative;width:340px}.sr .i{position:absolute;left:14px;top:13px;color:var(--mut)}.sr input{padding-left:42px;height:44px}
.pf{display:flex;gap:10px;align-items:center;height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
main{margin-left:var(--sw);padding:112px 32px 40px;transition:margin .25s}
/* controles */
.btn{display:inline-flex;align-items:center;gap:8px;padding:0 18px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);transition:.2s;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.g{background:var(--gold);border-color:var(--gold);color:#1A1A2E;font-weight:600}.btn.g:hover{filter:brightness(1.08);color:#1A1A2E}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 14px;font:inherit;outline:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select{width:auto}
label.l{display:block;margin:14px 0 6px;color:var(--mut);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;transition:.25s}
.ib{padding:6px;border-radius:8px;color:var(--mut);display:inline-flex;transition:.2s}.ib:hover{color:#e57373;background:rgba(255,255,255,.06)}
.ico{width:40px;height:40px;border-radius:10px;border:1px solid rgba(212,175,55,.35);background:rgba(212,175,55,.1);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .4s}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty{padding:48px;text-align:center;color:var(--mut)}
/* dashboard */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px}
.hello h1{font-size:46px;line-height:1.15;margin:8px 0 2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:28px}
.st{padding:22px}.st b{display:block;font:600 36px 'Playfair Display',serif;margin-top:22px;line-height:1}.st small{display:block;margin:4px 0 12px;color:var(--mut)}.st p{font-size:12px;color:var(--mut)}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px}.g11{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.cont{display:flex;gap:24px;padding:24px}
.cover{position:relative;display:flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden;cursor:pointer}
.cover b{font:600 46px 'Playfair Display',serif;color:rgba(0,0,0,.4);letter-spacing:.04em}
.bdg{position:absolute;top:10px;left:10px;font-size:10px;font-weight:600;letter-spacing:.1em;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.45);color:#fff}
.cont .cover{width:120px;height:320px;flex:none}
.cont h2{font-size:30px;margin:6px 0 2px}
.sc{padding:24px}.sc h2{font-size:24px;margin:4px 0 16px}
.at{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.atk{padding:16px;border:1px solid var(--line);border-radius:12px;text-align:left;display:flex;flex-direction:column;gap:18px;min-height:104px;transition:.2s;font:600 16px 'Inter'}
.atk:hover{border-color:var(--gold);background:rgba(212,175,55,.05)}
.pcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.pc{border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;background:var(--card);transition:.25s}.pc:hover{transform:translateY(-3px);border-color:rgba(212,175,55,.4)}
.pc .cover{height:160px;border-radius:0}.pc .cover b{font-size:44px}.pb{padding:18px}.pb h3{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid rgba(212,175,55,.35);background:rgba(212,175,55,.1);color:var(--gold);font-size:12px;margin-right:8px}
.pdel{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.45);opacity:0;color:#fff}.pc:hover .pdel{opacity:1}
.qt{padding:24px;display:flex;flex-direction:column}.qt .qm{font:700 90px/0.8 'Playfair Display',serif;color:rgba(255,255,255,.1)}
.qt blockquote{font:italic 500 25px/1.4 'Playfair Display',serif;margin:auto 0 16px}
.tl{display:flex;gap:14px;align-items:center;padding:12px 0}.tl .ico{border-radius:50%;width:38px;height:38px}.tl>div:nth-child(2){flex:1}.tl small{color:var(--mut);display:block}
.tk{display:flex;align-items:center;gap:12px;padding:10px 4px;cursor:pointer}
.cb{width:22px;height:22px;border:1.5px solid var(--mut);border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none;color:#1A1A2E}
.tk.d .cb{background:var(--gold);border-color:var(--gold)}.tk.d span{text-decoration:line-through;color:var(--mut)}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.doc{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.doc:hover{border-color:rgba(212,175,55,.4)}.doc>div:nth-child(2){flex:1;min-width:0}.doc>div:last-child{text-align:right;font-size:12px;color:var(--mut)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,10,20,.65);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.ov.on{display:flex}
.md{width:100%;max-width:440px;padding:24px;max-height:90vh;overflow:auto}.md h3{font-size:22px}
.mf{display:flex;justify-content:space-between;gap:8px;margin-top:22px}
/* editor */
.ed{display:flex;gap:20px;align-items:flex-start}.edm{flex:1;min-width:0}
.tb{position:sticky;top:96px;z-index:3;display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;padding:8px 10px;margin-bottom:20px;background:var(--card)}
.tb button,.tb .tbb{padding:7px;border-radius:7px;color:var(--mut);display:inline-flex;align-items:center;gap:6px;font-size:13px}
.tb button:hover{background:rgba(212,175,55,.14);color:var(--gold)}
.tb select{padding:6px 10px;font-size:13px;height:34px}.tb input[type=number]{width:58px;height:34px;padding:4px 6px;text-align:center}
.tb input[type=color]{width:30px;height:30px;padding:2px;border-radius:7px;cursor:pointer}
.sp{width:1px;height:22px;background:var(--line);margin:0 6px}
.sheet{width:100%;max-width:794px;min-height:1123px;margin:0 auto;box-shadow:0 14px 44px rgba(0,0,0,.5);border-radius:2px;display:flex;flex-direction:column;transition:padding .2s}
.page{flex:1;outline:0;font:16px/1.8 Georgia,serif;min-height:900px}.page ul,.page ol{margin-left:24px}
.wc{border-top:1px solid rgba(128,128,128,.3);padding-top:10px;margin-top:24px;font:12px Inter,sans-serif;opacity:.6;text-align:right}
.chs{width:230px;padding:16px;flex:none;position:sticky;top:96px}
.ch{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;color:var(--mut);margin-bottom:4px}.ch:hover{background:rgba(255,255,255,.04)}.ch.on{background:rgba(212,175,55,.12);color:var(--gold)}
/* world */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:24px;align-items:center}
.tab{padding:10px 18px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}.tab.on{color:var(--gold);border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.wi{padding:20px;cursor:pointer}.wi:hover{border-color:rgba(212,175,55,.4);transform:translateY(-2px)}.wi h3{font-size:19px;margin-bottom:6px}.wi p{color:var(--mut);font-size:13px}
.tag{display:inline-block;margin:10px 6px 0 0;padding:2px 10px;border-radius:99px;background:rgba(212,175,55,.12);color:var(--gold);font-size:11px}
/* quadro */
.cv{height:calc(100vh - 230px);overflow:auto;border-radius:14px;border:1px solid var(--line);background:#F4F1E8}
.cvi{position:relative;width:2400px;height:1600px;background-image:radial-gradient(#cfcab8 1px,transparent 1px);background-size:24px 24px}
.note{position:absolute;width:190px;background:#F6E27A;color:#2b2a22;border-radius:3px;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.nh{height:26px;cursor:grab;display:flex;justify-content:flex-end;align-items:center;background:rgba(0,0,0,.08);touch-action:none}.nh button{color:#5c5530;padding:4px;display:inline-flex}
.nt{min-height:110px;padding:10px;outline:0;font:15px/1.4 Georgia,serif}
/* ferramentas */
.gen{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:24px}.gen .card{padding:22px}.gen p{font:500 20px/1.4 'Playfair Display',serif;margin-top:8px}
@media(max-width:1100px){.g2,.g11,.docs{grid-template-columns:1fr}.cont{flex-direction:column}.cont .cover{width:100%;height:160px}.ed{flex-direction:column-reverse}.chs{width:100%;position:static}.sr{width:200px}}
@media(max-width:820px){:root{--sw:64px}.lgt,.nav span,.mod{display:none}.nav{justify-content:center}.hd{padding:0 14px}.ht h2,.ht .mut,.pf,.sr{display:none}main{padding:100px 14px 32px}.hello h1{font-size:32px}.sheet{padding:28px!important}}
@media print{.side,.hd,.tb,.chs,.ov,.wc{display:none!important}main{margin:0;padding:0}.sheet{box-shadow:none;max-width:none;min-height:0}body{background:#fff}}
</style>
</head>
<body>
<a class="bml-skip" href="#vw">Pular para o conteúdo principal</a>
<aside class="side" aria-label="Barra lateral">
 <div class="lg"><div class="lgi" id="logoi"></div><div class="lgt"><b>Biblioteca</b><small>À MEIA LUZ</small></div></div>
 <div class="mod">MÓDULOS</div><nav id="nav" aria-label="Navegação principal"></nav>
 <div class="fo"><button class="nav" onclick="document.body.classList.toggle('col')" id="rec"></button></div>
</aside>
<header class="hd">
 <div class="ht"><span id="hi"></span><h2 id="vt"></h2><span class="mut">›</span><span class="mut" id="vs"></span></div>
 <div class="hr"><div class="sr"><span id="si"></span><input id="q" placeholder="Buscar projetos e capítulos" oninput="busca(this.value)"></div><button class="btn g" onclick="novoProjeto()" id="bnp"></button><div class="pf" id="pf"></div></div>

<script>window.addEventListener('error',function(e){var m=document.getElementById('vw');if(m)m.innerHTML='<div style="padding:32px;max-width:640px"><h2 style="font-family:Georgia,serif">Algo deu errado ao carregar</h2><p style="margin:12px 0;color:#9C9CAA">'+String(e.message).replace(/</g,'&lt;')+'</p><button onclick="location.reload()" style="padding:10px 18px;border-radius:10px;background:#D4AF37;color:#1A1A2E;border:0;font-weight:600;cursor:pointer">Recarregar sem apagar seus dados</button><p style="margin-top:10px;color:#9C9CAA;font-size:12px">Se o erro continuar, faça uma exportação/backup antes de qualquer procedimento de recuperação.</p></div>'})</script>
<script>
/* ===== ÍCONES (Lucide outline) ===== */
const ic=p=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
const I={
dash:ic('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>'),
edit:ic('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
globe:ic('<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'),
bulb:ic('<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4"/>'),
pub:ic('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>'),
spark:ic('<path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/><path d="M19 17v4M17 19h4"/>'),
map:ic('<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>'),
dl:ic('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/>'),
panel:ic('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>'),
compass:ic('<circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/>'),
search:ic('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'),
user:ic('<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'),
plus:ic('<path d="M12 5v14M5 12h14"/>'),
newp:ic('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/>'),
trash:ic('<path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/>'),x:ic('<path d="M18 6 6 18M6 6l12 12"/>'),
b:ic('<path d="M6 4h8a4 4 0 0 1 0 8H6zM6 12h9a4 4 0 0 1 0 8H6z"/>'),it:ic('<path d="M19 4h-9M14 20H5M15 4 9 20"/>'),u:ic('<path d="M6 4v6a6 6 0 0 0 12 0V4M4 20h16"/>'),
al:ic('<path d="M3 6h18M3 12h12M3 18h16"/>'),ac:ic('<path d="M3 6h18M7 12h10M5 18h14"/>'),ar:ic('<path d="M3 6h18M9 12h12M5 18h16"/>'),aj:ic('<path d="M3 6h18M3 12h18M3 18h18"/>'),
ul:ic('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),ol:ic('<path d="M10 6h11M10 12h11M10 18h11M4 6h1v4M4 10h2M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/>'),
minus:ic('<path d="M5 12h14"/>'),up:ic('<path d="M12 19V5M5 12l7-7 7 7"/>'),
flame:ic('<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.4 1-3.1 0 1.4 1 2.6 2.5 2.6z"/>'),
target:ic('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'),
book:ic('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/><path d="M20 22H6.5a2.5 2.5 0 0 1 0-5H20z"/>'),
file:ic('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>'),
ref:ic('<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>'),
ok:ic('<path d="M20 6 9 17l-5-5"/>'),type:ic('<path d="M4 7V4h16v3M9 20h6M12 4v16"/>')
};

I.pen=I.edit;
/* ===== ESTADO + PERSISTÊNCIA (localStorage) ===== */
const K={p:'biblioteca.projetos',w:'biblioteca.worldbuilding',f:'biblioteca.preferencias',t:'biblioteca.fontes'};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)};
const words=h=>String(h||'').replace(/<\/(p|div|li|h\d)>|<br\s*\/?>/gi,' ').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').split(/\s+/).filter(Boolean).length;
const fmt=n=>n.toLocaleString('pt-BR');
const H=3600e3,now=Date.now();
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);if(m<1)return'agora';if(m<60)return'há '+m+' min';const h=Math.floor(m/60);if(h<24)return'há '+h+' h';const d=Math.floor(h/24);return'há '+d+(d===1?' dia':' dias')};
const cap=t=>({id:uid(),titulo:t[0],texto:t[1],at:now-t[2]*H});
/* Seed */
const seed=()=>[

function dlf(blob,n){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
const slug=()=>(chap().titulo||'documento').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function exPDF(){if(F.view!=='editor')go('editor');setTimeout(()=>print(),150)}
function exMD(){if(F.view!=='editor')go('editor');
 let h=$('#pg').innerHTML.replace(/<(b|strong)[^>]*>(.*?)<\/\1>/gi,'**$2**').replace(/<(i|em)[^>]*>(.*?)<\/\1>/gi,'*$2*').replace(/<li[^>]*>(.*?)<\/li>/gi,'- $1\n').replace(/<\/(p|div|ul|ol)>/gi,'\n\n').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
 dlf(new Blob(['# '+chap().titulo+'\n\n'+h.replace(/\n{3,}/g,'\n\n').trim()+'\n'],{type:'text/markdown'}),slug()+'.md')}
function exDOCX(){if(F.view!=='editor')go('editor');
 const run=()=>{const x=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const runs=(n,s)=>{let o='';n.childNodes.forEach(c=>{if(c.nodeType===3){if(c.data)o+='<w:r><w:rPr>'+(s.b?'<w:b/>':'')+(s.i?'<w:i/>':'')+(s.u?'<w:u w:val="single"/>':'')+'</w:rPr><w:t xml:space="preserve">'+x(c.data)+'</w:t></w:r>'}else if(c.nodeType===1){const t=c.tagName;o+=t==='BR'?'<w:r><w:br/></w:r>':runs(c,{b:s.b||/^(B|STRONG)$/.test(t),i:s.i||/^(I|EM)$/.test(t),u:s.u||t==='U'})}});return o};
  const par=(n,pre)=>{const a={center:'center',right:'right',justify:'both'}[n.style&&n.style.textAlign];return '<w:p><w:pPr>'+(a?'<w:jc w:val="'+a+'"/>':'')+'</w:pPr>'+(pre?'<w:r><w:t xml:space="preserve">'+pre+'</w:t></w:r>':'')+runs(n,{})+'</w:p>'};
  let body='<w:p><w:pPr><w:pStyle w:val="Title"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="36"/></w:rPr><w:t>'+x(chap().titulo)+'</w:t></w:r></w:p>';
  $('#pg').childNodes.forEach(n=>{if(n.nodeType===3){if(n.data.trim())body+='<w:p><w:r><w:t>'+x(n.data)+'</w:t></w:r></w:p>'}else if(/^(UL|OL)$/.test(n.tagName)){[...n.children].forEach((li,i)=>body+=par(li,n.tagName==='UL'?'• ':(i+1)+'. '))}else body+=par(n)});
  const z=new JSZip();z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.file('word/document.xml','<?xml version="1.0" encoding="UTF-8"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr></w:body></w:document>');
  z.generateAsync({type:'blob'}).then(b=>dlf(b,slug()+'.docx'))};
 if(window.JSZip)return run();
 const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=run;s.onerror=()=>modal('Exportar DOCX','<p class="mut" style="margin-top:10px">Não foi possível carregar o gerador de DOCX. Verifique a conexão com a internet e tente novamente.</p>',()=>{},'Ok');document.head.appendChild(s)}

.wb-tg button{width:44px;height:42px;display:flex;align-items:center;justify-content:center;color:var(--mut,#9C9CAA);transition:.2s}.wb-tg button:hover{color:var(--tx,#F5F5F0)}.wb-tg button.on{background:rgba(212,175,55,.16);color:var(--gold,#D4AF37)}
.wb-tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line,rgba(245,245,240,.08));margin-bottom:24px}
.wb-t{display:flex;align-items:center;gap:8px;padding:11px 16px;color:var(--mut,#9C9CAA);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:.2s}.wb-t:hover{color:var(--tx,#F5F5F0)}.wb-t.on{color:var(--gold,#D4AF37);border-color:var(--gold,#D4AF37)}
.wb-t b{font:600 11px Inter,sans-serif;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.07)}.wb-t.on b{background:rgba(212,175,55,.18)}
.wb-sec{display:flex;align-items:center;gap:8px;margin:6px 0 12px;font:600 20px 'Playfair Display',serif}.wb-sec span{font:500 12px Inter,sans-serif;color:var(--mut,#9C9CAA)}
.wb-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-bottom:28px}
.wb-c{background:var(--card,#22223A);border:1px solid var(--line,rgba(245,245,240,.08));border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:.25s}.wb-c:hover{transform:translateY(-3px);border-color:rgba(212,175,55,.4)}
.wb-i{height:120px;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}.wb-i b{font:600 40px 'Playfair Display',serif;color:rgba(255,255,255,.55);letter-spacing:.04em}
.wb-cb{padding:16px 16px 8px;flex:1}.wb-cb h3{font-size:19px;margin-bottom:8px}
.wb-bds{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wb-bd{font-size:11px;padding:2px 10px;border-radius:99px;border:1px solid rgba(212,175,55,.4);background:rgba(212,175,55,.1);color:var(--gold,#D4AF37)}.wb-im,.wb-dt{font-size:11px;color:var(--mut,#9C9CAA)}
.wb-cb p{color:var(--mut,#9C9CAA);font-size:13px;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wb-a{display:flex;justify-content:flex-end;gap:2px;padding:4px 10px 10px}
.wb-ab{width:32px;height:32px;border-radius:8px;color:var(--mut,#9C9CAA);display:inline-flex;align-items:center;justify-content:center;transition:.2s}.wb-ab:hover{background:rgba(212,175,55,.14);color:var(--gold,#D4AF37)}.wb-ab.fav{color:var(--gold,#D4AF37)}.wb-ab.del:hover{background:rgba(229,115,115,.14);color:#e57373}
.wb-ab svg.f{fill:currentColor}
.wb-ls{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.wb-ro{display:flex;align-items:center;gap:14px;padding:10px 12px;background:var(--card,#22223A);border:1px solid var(--line,rgba(245,245,240,.08));border-radius:12px;cursor:pointer;transition:.2s}.wb-ro:hover{border-color:rgba(212,175,55,.4)}
.wb-ro .wb-i{width:52px;height:52px;border-radius:10px;flex:none}.wb-ro .wb-i b{font-size:18px}.wb-rm{flex:1;min-width:0}.wb-rm b{font-weight:600}.wb-rm p{color:var(--mut,#9C9CAA);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wb-ro .wb-bds{flex:none;max-width:34%;justify-content:flex-end}.wb-ro .wb-a{padding:0}
.wb-side{width:290px;flex:none;position:sticky;top:96px;display:flex;flex-direction:column;gap:16px}.wb-p{padding:18px}.wb-p h3{font-size:19px;margin:4px 0 12px}
.wb-r{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px;border-radius:10px;transition:.2s}.wb-r:hover{background:rgba(212,175,55,.08)}.wb-r b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}.wb-r small{color:var(--mut,#9C9CAA)}
.wb-ri{width:34px;height:34px;border-radius:9px;border:1px solid rgba(212,175,55,.35);background:rgba(212,175,55,.1);color:var(--gold,#D4AF37);display:flex;align-items:center;justify-content:center;flex:none}
.wb-st{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:10px;font-size:13px}.wb-st .bar{grid-column:1/-1}.wb-st b{font-weight:600}.wb-nada{color:var(--mut,#9C9CAA);font-size:13px;padding:4px 8px}
.wb-em{padding:56px 24px;text-align:center}.wb-em .wb-ri{width:56px;height:56px;margin:0 auto 18px;border-radius:14px}.wb-em .wb-ri svg{width:26px;height:26px}.wb-em h2{font-size:24px;margin-bottom:8px}.wb-em p{color:var(--mut,#9C9CAA);max-width:380px;margin:0 auto 22px}
.wb-up{display:flex;gap:10px;align-items:center}.wb-pv{width:56px;height:56px;border-radius:10px;border:1px solid var(--line,rgba(245,245,240,.08));background:var(--bg,#1A1A2E) center/cover no-repeat;flex:none}
@media(max-width:1100px){.wb{flex-direction:column}.wb-side{width:100%;position:static}}
</style>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=n=>String(n).split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const tempo=t=>typeof ago==='function'?ago(t):'';
const ic=p=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
const WI={search:ic('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'),grid:ic('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>'),list:ic('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),plus:ic('<path d="M12 5v14M5 12h14"/>'),
edit:ic('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),trash:ic('<path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/>'),
star:ic('<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21.1 7 14.2 2 9.3l6.9-1z"/>'),starf:'<svg class="i f" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21.1 7 14.2 2 9.3l6.9-1z"/></svg>',
user:ic('<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'),pin:ic('<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>'),
clock:ic('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'),shield:ic('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'),spark:ic('<path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/><path d="M19 17v4M17 19h4"/>'),
leaf:ic('<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z"/><path d="M2 21c0-3 1.9-5.4 5.1-6C9.5 14.5 12 13 13 12"/>'),gem:ic('<path d="M6 3h12l4 6-10 13L2 9z"/><path d="M11 3 8 9l4 13 4-13-3-6M2 9h20"/>')};

/* ===== CONFIGURAÇÃO DAS ABAS (edite aqui opções de Status/Importância) ===== */
const T={
 personagens:{n:'Personagens',item:'Personagem',novo:'Novo Personagem',g:'o',ic:'user',cor:['#6a58d6','#1d1840'],st:['Protagonista','Antagonista','Coadjuvante','Mentor','Aliado'],imp:['Principal','Secundário','Menor']},
 locais:{n:'Locais',item:'Local',novo:'Novo Local',g:'o',ic:'pin',cor:['#1f8f72','#0f2a22'],st:['Cidade','Reino','Floresta','Montanha','Ruínas','Oceano'],imp:['Central','Relevante','Pano de fundo']},
 timeline:{n:'Timeline',item:'Evento',novo:'Novo Evento',g:'o',ic:'clock',cor:['#3b7db0','#10202e'],st:['Passado','Presente','Futuro','Lenda'],imp:['Marco histórico','Importante','Menor']},
 faccoes:{n:'Facções',item:'Facção',novo:'Nova Facção',g:'a',ic:'shield',cor:['#b0446a','#2a1020'],st:['Ativa','Aliada','Rival','Secreta','Extinta'],imp:['Dominante','Influente','Marginal']},
 magia:{n:'Magia',item:'Magia',novo:'Nova Magia',g:'a',ic:'spark',cor:['#B8941F','#3b2e0a'],st:['Ativa','Proibida','Perdida','Lendária'],imp:['Fundamental','Comum','Rara']},
 especies:{n:'Espécies',item:'Espécie',novo:'Nova Espécie',g:'a',ic:'leaf',cor:['#4f8a3a','#17260f'],st:['Comum','Rara','Em extinção','Extinta','Lendária'],imp:['Dominante','Comum','Rara']},
 itens:{n:'Itens',item:'Item',novo:'Novo Item',g:'o',ic:'gem',cor:['#8a5a2f','#2a1a0c'],st:['Comum','Raro','Lendário','Perdido','Amaldiçoado'],imp:['Lendário','Importante','Comum']}};
const KEYS=Object.keys(T);
let Q='';

/* ===== DADOS: tudo dentro do projeto atual (project.worldbuilding.<aba>) ===== */
function wb(p){
 if(!p.worldbuilding||typeof p.worldbuilding!=='object')p.worldbuilding=(typeof W!=='undefined'&&W[p.id])||{};   /* migra dados antigos */
 const w=p.worldbuilding;
 KEYS.forEach(k=>{if(!Array.isArray(w[k]))w[k]=[];w[k].forEach(i=>{if(typeof i.tags==='string')i.tags=i.tags.split(',').map(t=>t.trim()).filter(Boolean);if(!Array.isArray(i.tags))i.tags=[];i.id=i.id||uid();i.nome=i.nome||'Sem nome';i.desc=i.desc||'';i.fav=!!i.fav;i.st=i.st||'';i.imp=i.imp||'';i.at=i.at||Date.now()})});
 if(typeof W!=='undefined')W[p.id]=w;
 return w}
const itens=k=>wb(ap())[k];

/* ===== RENDER ===== */
function rWorld(){
 const p=ap(),el=$('#vw');
 if(!p){el.innerHTML='<div class="card empty">Nenhum projeto ainda. Crie o primeiro em “Novo projeto”.</div>';return}
 if(!T[F.tab])F.tab='personagens';if(F.wv!=='lista')F.wv='cards';Q='';wb(p);
 el.innerHTML='<div class="wb"><div class="wb-main">'
 +'<div class="wb-hd"><h1>Worldbuilding</h1><div class="wb-hr"><select id="wb-pj" aria-label="Projeto" style="max-width:200px">'+P.map(x=>'<option value="'+x.id+'"'+(x.id===p.id?' selected':'')+'>'+esc(x.nome)+'</option>').join('')+'</select><button class="btn g" id="wb-new"></button></div></div>'
 +'<div class="wb-tools"><div class="wb-s">'+WI.search+'<input id="wb-q" placeholder="Buscar em todas as abas..." aria-label="Buscar"></div><div class="wb-tg"><button data-v="cards" title="Cards" aria-label="Ver em cards">'+WI.grid+'</button><button data-v="lista" title="Lista" aria-label="Ver em lista">'+WI.list+'</button></div></div>'
 +'<div class="wb-tabs" id="wb-tabs"></div><div id="wb-body"></div></div><aside class="wb-side" id="wb-side"></aside></div>';
 $('#wb-pj').onchange=e=>{F.ativo=e.target.value;F.cap=null;sv();rWorld()};
 $('#wb-new').onclick=()=>editar();
 $('#wb-q').oninput=e=>{Q=e.target.value;drawTabs();drawBody()};
 document.querySelectorAll('.wb-tg button').forEach(b=>b.onclick=()=>{F.wv=b.dataset.v;sv();refresh()});
 $('#wb-tabs').onclick=e=>{const t=e.target.closest('[data-k]');if(t){F.tab=t.dataset.k;sv();refresh()}};
 $('#wb-body').onclick=e=>{const r=e.target.closest('[data-id]');if(!r)return;const a=e.target.closest('[data-a]'),id=r.dataset.id,k=r.dataset.k;
  if(a&&a.dataset.a==='fav'){const it=itens(k).find(x=>x.id===id);it.fav=!it.fav;sv();drawBody();drawSide()}
  else if(a&&a.dataset.a==='del')excluir(k,id);else editar(id,k)};
 $('#wb-side').onclick=e=>{const r=e.target.closest('[data-id]');if(r){F.tab=r.dataset.k;Q='';$('#wb-q').value='';sv();refresh();editar(r.dataset.id,r.dataset.k)}};
 refresh()}
function refresh(){const c=T[F.tab];$('#wb-new').innerHTML=WI.plus+c.novo;
 document.querySelectorAll('.wb-tg button').forEach(b=>b.classList.toggle('on',b.dataset.v===F.wv));drawTabs();drawBody();drawSide()}
const match=(i,q)=>(i.nome+' '+i.desc+' '+i.tags.join(' ')+' '+i.st+' '+i.imp+' '+(i.data||'')).toLowerCase().includes(q);
function drawTabs(){const w=wb(ap()),q=Q.trim().toLowerCase();
 $('#wb-tabs').innerHTML=KEYS.map(k=>'<button class="wb-t'+(k===F.tab?' on':'')+'" data-k="'+k+'">'+WI[T[k].ic]+T[k].n+'<b>'+(q?w[k].filter(i=>match(i,q)).length:w[k].length)+'</b></button>').join('')}
const wrap=h=>'<div class="'+(F.wv==='lista'?'wb-ls':'wb-g')+'">'+h+'</div>';
function drawBody(){const w=wb(ap()),q=Q.trim().toLowerCase(),el=$('#wb-body'),ord=a=>[...a].sort((x,y)=>(y.fav-x.fav)||(y.at-x.at));
 if(q){const gs=KEYS.map(k=>[k,ord(w[k].filter(i=>match(i,q)))]).filter(g=>g[1].length);
  el.innerHTML=gs.length?gs.map(([k,a])=>'<div class="wb-sec">'+T[k].n+' <span>'+a.length+'</span></div>'+wrap(a.map(i=>item(i,k)).join(''))).join(''):'<div class="card wb-em"><h2>Nada encontrado</h2><p>Nenhum item corresponde a “'+esc(Q)+'”. Tente outro termo.</p></div>';return}
 const a=ord(w[F.tab]),c=T[F.tab];
 el.innerHTML=a.length?wrap(a.map(i=>item(i,F.tab)).join('')):'<div class="card wb-em"><div class="wb-ri">'+WI[c.ic]+'</div><h2>Seu mundo ainda está em branco</h2><p>Nenhum'+(c.g==='a'?'a':'')+' '+c.item.toLowerCase()+' por aqui. Crie '+(c.g==='a'?'a primeira':'o primeiro')+' '+c.item.toLowerCase()+' e comece a dar vida ao seu universo.</p><button class="btn g" id="wb-first">'+WI.plus+'Criar '+(c.g==='a'?'primeira ':'primeiro ')+c.item.toLowerCase()+'</button></div>';
 const f=$('#wb-first');if(f)f.onclick=()=>editar()}
function item(i,k){const c=T[k],bg=i.img?"background-image:url('"+i.img+"')":'background:linear-gradient(145deg,'+c.cor[0]+','+c.cor[1]+')';
 const th='<div class="wb-i" style="'+bg+'">'+(i.img?'':'<b>'+esc(ini(i.nome))+'</b>')+'</div>';
 const bds=(i.st?'<span class="wb-bd">'+esc(i.st)+'</span>':'')+(i.imp?'<span class="wb-im">'+esc(i.imp)+'</span>':'')+(i.data?'<span class="wb-dt">'+esc(i.data)+'</span>':'');
 const tg=i.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
 const ac='<div class="wb-a"><button class="wb-ab'+(i.fav?' fav':'')+'" data-a="fav" title="Favoritar" aria-label="Favoritar">'+(i.fav?WI.starf:WI.star)+'</button><button class="wb-ab" data-a="ed" title="Editar" aria-label="Editar">'+WI.edit+'</button><button class="wb-ab del" data-a="del" title="Excluir" aria-label="Excluir">'+WI.trash+'</button></div>';
 return F.wv==='lista'
  ?'<div class="wb-ro" data-id="'+i.id+'" data-k="'+k+'">'+th+'<div class="wb-rm"><b>'+esc(i.nome)+'</b><p>'+esc(i.desc||'Sem descrição')+'</p></div><div class="wb-bds">'+bds+'</div>'+ac+'</div>'
  :'<div class="wb-c" data-id="'+i.id+'" data-k="'+k+'">'+th+'<div class="wb-cb"><h3>'+esc(i.nome)+'</h3><div class="wb-bds">'+bds+'</div>'+(i.desc?'<p>'+esc(i.desc)+'</p>':'')+tg+'</div>'+ac+'</div>'}
function drawSide(){const w=wb(ap()),all=KEYS.flatMap(k=>w[k].map(i=>({i,k}))),rec=[...all].sort((a,b)=>b.i.at-a.i.at).slice(0,5),fav=all.filter(x=>x.i.fav).slice(0,6),mx=Math.max(1,...KEYS.map(k=>w[k].length));
 const row=x=>'<button class="wb-r" data-id="'+x.i.id+'" data-k="'+x.k+'"><span class="wb-ri">'+WI[T[x.k].ic]+'</span><span><b>'+esc(x.i.nome)+'</b><small>'+T[x.k].item+' · '+tempo(x.i.at)+'</small></span></button>';
 $('#wb-side').innerHTML='<div class="card wb-p"><span class="eb">Atividade</span><h3>Itens recentes</h3>'+(rec.map(row).join('')||'<div class="wb-nada">Nada criado ainda.</div>')+'</div>'
 +'<div class="card wb-p"><span class="eb">Destaques</span><h3>Favoritos</h3>'+(fav.map(row).join('')||'<div class="wb-nada">Toque na estrela de um item para fixá-lo aqui.</div>')+'</div>'
 +'<div class="card wb-p"><span class="eb">Visão geral</span><h3>Estatísticas · '+all.length+'</h3>'+KEYS.map(k=>'<div class="wb-st"><span>'+T[k].n+'</span><b>'+w[k].length+'</b><div class="bar"><i style="width:'+w[k].length/mx*100+'%"></i></div></div>').join('')+'</div>'}

/* ===== CRIAR / EDITAR / EXCLUIR ===== */
function reduzir(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)}
function editar(id,k){k=k||F.tab;const c=T[k],list=itens(k),it=id?list.find(x=>x.id===id):null;let img=it&&it.img||'';
 const opts=(a,v)=>(v&&!a.includes(v)?[v].concat(a):a).map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('');
 const f=(l,h)=>'<label class="l">'+l+'</label>'+h;
 modal(it?'Editar '+c.item.toLowerCase():c.novo,
  f('Nome','<input id="wb-n" maxlength="80" value="'+esc(it?it.nome:'')+'">')
  +(k==='timeline'?f('Data / época','<input id="wb-d" placeholder="Ex.: Ano 312 da Era Antiga" value="'+esc(it&&it.data||'')+'">'):'')
  +f('Descrição','<textarea id="wb-ds" rows="4">'+esc(it?it.desc:'')+'</textarea>')
  +f('Tags (separadas por vírgula)','<input id="wb-tg" value="'+esc(it?it.tags.join(', '):'')+'">')
  +'<div style="display:flex;gap:12px"><div style="flex:1">'+f('Status','<select id="wb-st" style="width:100%">'+opts(c.st,it?it.st:c.st[0])+'</select>')+'</div><div style="flex:1">'+f('Importância','<select id="wb-im" style="width:100%">'+opts(c.imp,it?it.imp:c.imp[1])+'</select>')+'</div></div>'
  +f('Imagem (opcional)','<div class="wb-up"><div class="wb-pv" id="wb-pv"></div><label class="btn sm" style="cursor:pointer">Escolher imagem<input type="file" id="wb-f" accept="image/*" hidden></label><button type="button" class="btn sm" id="wb-rm">Remover</button></div>'),
  ()=>{const n=$('#wb-n').value.trim();if(!n){$('#wb-n').focus();return false}
   const d={nome:n,desc:$('#wb-ds').value.trim(),tags:$('#wb-tg').value.split(',').map(t=>t.trim()).filter(Boolean),st:$('#wb-st').value,imp:$('#wb-im').value,img:img};
   if(k==='timeline')d.data=$('#wb-d').value.trim();
   if(it)Object.assign(it,d,{at:Date.now()});else list.unshift(Object.assign({id:uid(),fav:false,at:Date.now()},d));
   F.tab=k;sv();if(F.view==='world'){const q=$('#wb-q');if(q&&Q&&!match(list[0],Q.toLowerCase())){Q='';q.value=''}refresh()}},'Salvar');
 const pv=()=>{const e=$('#wb-pv');if(e)e.style.backgroundImage=img?"url('"+img+"')":'none'};pv();
 $('#wb-f').onchange=e=>{const fl=e.target.files[0];if(fl)reduzir(fl,d=>{img=d;pv()})};
 $('#wb-rm').onclick=()=>{img='';pv()}}
function excluir(k,id){const it=itens(k).find(x=>x.id===id),c=T[k];
 modal('Excluir '+c.item.toLowerCase(),'<p class="mut" style="margin-top:10px">“'+esc(it.nome)+'” será removid'+c.g+' permanentemente. Essa ação não pode ser desfeita.</p>',()=>{wb(ap())[k]=itens(k).filter(x=>x.id!==id);sv();refresh()},'Excluir')}

/* substitui o módulo antigo: go('world') e o atalho "Novo personagem" passam a usar este */
window.rWorld=rWorld;window.editW=id=>editar(id,F.tab);
if(typeof F!=='undefined'&&F.view==='world')rWorld();
})();
</script>

 <!-- ===================== QV: QUADRO VISUAL (cole antes do </body>) ===================== -->
<style>
.qv-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}.qv-top h1{font-size:34px}
.qv{display:flex;gap:12px;height:calc(100vh - 230px);min-height:440px;padding:12px;background:#0F0F15;border:1px solid rgba(245,245,240,.08);border-radius:18px}
.qv-tb{display:flex;flex-direction:column;gap:4px;padding:8px;align-self:flex-start;background:#15151F;border:1px solid rgba(245,245,240,.08);border-radius:14px}
.qv-tb button{position:relative;width:44px;height:44px;border:0;background:none;border-radius:10px;color:#D4AF37;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.qv-tb button:hover{background:rgba(212,175,55,.14);transform:translateX(2px)}
.qv-tb button::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);padding:5px 10px;border-radius:8px;background:#1d1d2b;border:1px solid rgba(212,175,55,.3);color:#F5F5F0;font:12px Inter,sans-serif;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:40}
.qv-tb button:hover::after{opacity:1}.qv-sep{height:1px;background:rgba(245,245,240,.08);margin:4px 6px}
.qv-vp{flex:1;min-width:0;position:relative;overflow:hidden;border-radius:12px;background-color:#1A1A24;background-image:radial-gradient(rgba(245,245,240,.11) 1px,transparent 1px);background-size:24px 24px;touch-action:none;--inv:1}
.qv-vp.pan{cursor:grabbing}
.qv-w{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.qv-el{position:absolute;box-sizing:border-box;user-select:none;touch-action:none;cursor:move}
.qv-nota{border:1px solid #D4AF37;border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.45);padding:14px;overflow:hidden}
.qv-texto{padding:4px 8px;border:1px dashed transparent}.qv-texto:hover{border-color:rgba(212,175,55,.35)}
.qv-forma{border:1px solid rgba(255,255,255,.12)}.qv-forma.circ{border-radius:50%}
.qv-img img{width:100%;height:100%;display:block;object-fit:fill;border-radius:6px;pointer-events:none}
.qv-tx{outline:0;height:100%;white-space:pre-wrap;word-break:break-word;font:15px/1.5 Inter,sans-serif}.qv-texto .qv-tx{font:600 34px/1.2 'Playfair Display',Georgia,serif;overflow:visible}
.qv-tx:empty::before{content:attr(data-ph);opacity:.45}.qv-el.ed{cursor:text}.qv-el.ed .qv-tx{cursor:text}
.qv-el.sel{outline:1.5px solid #D4AF37;outline-offset:3px}
.qv-h{position:absolute;width:calc(11px*var(--inv));height:calc(11px*var(--inv));background:#D4AF37;border:calc(1.5px*var(--inv)) solid #0F0F15;border-radius:calc(3px*var(--inv));z-index:5}
.qv-h[data-h=nw]{left:calc(-8px*var(--inv));top:calc(-8px*var(--inv));cursor:nwse-resize}.qv-h[data-h=ne]{right:calc(-8px*var(--inv));top:calc(-8px*var(--inv));cursor:nesw-resize}
.qv-h[data-h=sw]{left:calc(-8px*var(--inv));bottom:calc(-8px*var(--inv));cursor:nesw-resize}.qv-h[data-h=se]{right:calc(-8px*var(--inv));bottom:calc(-8px*var(--inv));cursor:nwse-resize}
.qv-rot{position:absolute;left:50%;top:calc(-38px*var(--inv));width:calc(14px*var(--inv));height:calc(14px*var(--inv));margin-left:calc(-7px*var(--inv));border-radius:50%;background:#D4AF37;border:calc(1.5px*var(--inv)) solid #0F0F15;cursor:grab;z-index:5}
.qv-rot::before{content:'';position:absolute;left:50%;top:100%;width:calc(1.5px*var(--inv));height:calc(22px*var(--inv));background:#D4AF37;transform:translateX(-50%)}
.qv-menu{position:absolute;z-index:30;display:none;flex-direction:column;gap:4px;padding:5px;background:#1d1d2b;border:1px solid rgba(212,175,55,.35);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.55)}
.qv-mi{display:flex;align-items:center;gap:2px}.qv-mi button{width:34px;height:34px;border:0;background:none;border-radius:8px;color:#D4AF37;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.qv-mi button:hover{background:rgba(212,175,55,.16)}.qv-mi button[data-m=del]:hover{background:rgba(229,115,115,.18);color:#e57373}.qv-mi i{width:1px;height:20px;background:rgba(245,245,240,.1);margin:0 3px}
.qv-pal{display:none;grid-template-columns:repeat(5,24px);gap:7px;padding:6px 8px 8px;align-items:center}.qv-menu.pal .qv-pal{display:grid}
.qv-sw{width:24px;height:24px;border-radius:7px;border:1px solid rgba(255,255,255,.2);cursor:pointer}.qv-sw:hover{outline:2px solid #D4AF37}.qv-sw[data-c=transparent]{background:linear-gradient(135deg,transparent 45%,#e57373 45%,#e57373 55%,transparent 55%)}
.qv-pal input[type=color]{width:24px;height:24px;padding:0;border:0;border-radius:7px;background:none;cursor:pointer}
.qv-zoom{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:2px;padding:4px;background:#1d1d2b;border:1px solid rgba(245,245,240,.1);border-radius:10px;z-index:20}
.qv-zoom button{width:30px;height:30px;border:0;background:none;border-radius:7px;color:#D4AF37;display:flex;align-items:center;justify-content:center;cursor:pointer}.qv-zoom button:hover{background:rgba(212,175,55,.14)}.qv-zoom span{min-width:44px;text-align:center;font:500 12px Inter,sans-serif;color:#9C9CAA}
.qv-hint{position:absolute;left:16px;bottom:14px;font:12px Inter,sans-serif;color:rgba(156,156,170,.7);pointer-events:none}
.qv-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:#9C9CAA;pointer-events:none;padding:24px}.qv-empty h2{font:600 24px 'Playfair Display',serif;color:#F5F5F0}
.qv-av{position:absolute;left:50%;top:16px;transform:translateX(-50%);padding:9px 16px;border-radius:10px;background:#2a1a1f;border:1px solid #e57373;color:#F5F5F0;font:13px Inter,sans-serif;display:none;z-index:40}
@media(max-width:820px){.qv-hint{display:none}}
</style>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const ic=p=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
const QI={nota:ic('<path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><path d="M15 3v6h6"/>'),img:ic('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>'),circ:ic('<circle cx="12" cy="12" r="9"/>'),quad:ic('<rect x="3" y="3" width="18" height="18" rx="2"/>'),texto:ic('<path d="M4 7V4h16v3M9 20h6M12 4v16"/>'),
cor:ic('<path d="M12 22a10 10 0 1 1 10-10c0 3-2 4-4.5 4H15a2 2 0 0 0-1.5 3.3A2 2 0 0 1 12 22z"/><path d="M7.5 10.5h.01M12 7.5h.01M16.5 10.5h.01"/>'),
fr:ic('<rect x="8" y="8" width="8" height="8" rx="2"/><path d="M4 10a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2M14 14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2"/>'),
tr:ic('<rect x="14" y="14" width="8" height="8" rx="2"/><rect x="2" y="2" width="8" height="8" rx="2"/><path d="M7 14v1a2 2 0 0 0 2 2h1M14 7h1a2 2 0 0 1 2 2v1"/>'),
dup:ic('<rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>'),del:ic('<path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/>'),
min:ic('<path d="M5 12h14"/>'),plus:ic('<path d="M12 5v14M5 12h14"/>'),fit:ic('<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>')};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MIN=40,CORES=['#262636','#D4AF37','#F6E27A','#8B1E3F','#2F4B7C','#1F6B57','#5B4B8A','#6B3F2F','#F5F5F0','transparent'];
const DEF={nota:{w:220,h:170,c:'#262636'},texto:{w:360,h:60,c:'transparent'},forma:{w:160,h:160,c:'#D4AF37'},img:{w:300,h:200,c:'transparent'}};
let V={x:80,y:60,s:1},sel=null,tv=null;
const VP=()=>$('#qv-vp'),WD=()=>$('#qv-w');
const lum=h=>{h=h.replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');return(parseInt(h.slice(0,2),16)*.299+parseInt(h.slice(2,4),16)*.587+parseInt(h.slice(4,6),16)*.114)/255};
const ink=c=>c==='transparent'?'#F5F5F0':(lum(c)>.6?'#1d1d26':'#F5F5F0');

/* ===== DADOS: project.quadroVisual = {els:[...], view:{x,y,s}} ===== */
function qd(p){
 if(!p.quadroVisual||!Array.isArray(p.quadroVisual.els)){   /* migra as notas do quadro antigo */
  p.quadroVisual={els:(p.notas||[]).map((n,i)=>({id:n.id||uid(),t:'nota',x:n.x||60,y:n.y||60,w:220,h:170,r:0,z:i+1,c:'#262636',txt:n.t||''})),view:{x:40,y:40,s:1}}}
 const q=p.quadroVisual;if(!q.view)q.view={x:40,y:40,s:1};
 q.els.forEach((e,i)=>{e.id=e.id||uid();e.r=+e.r||0;e.z=e.z||i+1;e.c=e.c||DEF[e.t].c;e.w=e.w||DEF[e.t].w;e.h=e.h||DEF[e.t].h});return q}
const els=()=>qd(ap()).els,get=id=>els().find(e=>e.id===id),dom=id=>VP()&&VP().querySelector('[data-id="'+id+'"]');
const top=()=>els().reduce((m,e)=>Math.max(m,e.z),0);
function persist(){try{localStorage.setItem(K.p,JSON.stringify(P))}catch(x){aviso('Armazenamento do navegador cheio. Use imagens menores ou remova algumas.');return false}sv();return true}
function aviso(t){const a=$('#qv-av');if(!a)return;a.textContent=t;a.style.display='block';setTimeout(()=>{a.style.display='none'},3800)}

/* ===== ELEMENTOS ===== */
function pl(d,e){d.style.left=e.x+'px';d.style.top=e.y+'px';d.style.width=e.w+'px';d.style.height=e.h+'px';d.style.transform='rotate('+e.r+'deg)';d.style.zIndex=e.z;d.style.background=e.c;d.style.color=ink(e.c)}
function mk(e){const d=document.createElement('div');d.className='qv-el qv-'+e.t+(e.sh==='circulo'?' circ':'');d.dataset.id=e.id;
 if(e.t==='img'){const i=document.createElement('img');i.src=e.src;i.alt='Imagem do quadro';i.draggable=false;d.appendChild(i)}
 else if(e.t==='nota'||e.t==='texto'){const t=document.createElement('div');t.className='qv-tx';t.dataset.ph=e.t==='nota'?'Escreva aqui...':'Título';t.textContent=e.txt||'';d.appendChild(t)}
 pl(d,e);return d}
function toWorld(cx,cy){const r=VP().getBoundingClientRect();return[(cx-r.left-V.x)/V.s,(cy-r.top-V.y)/V.s]}
function novo(t,x){const r=VP().getBoundingClientRect(),[cx,cy]=toWorld(r.left+r.width/2,r.top+r.height/2),df=DEF[t],w=x&&x.w||df.w,h=x&&x.h||df.h,j=(els().length%6)*16;
 const e=Object.assign({id:uid(),t,x:Math.round(cx-w/2+j),y:Math.round(cy-h/2+j),w,h,r:0,z:top()+1,c:df.c},x);els().push(e);const d=mk(e);WD().appendChild(d);select(e.id);vazio();persist();return d}
function editar(d){const t=d.querySelector('.qv-tx');if(!t)return;t.contentEditable='true';d.classList.add('ed');t.focus();
 const r=document.createRange();r.selectNodeContents(t);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);
 const fim=()=>{t.contentEditable='false';d.classList.remove('ed');const e=get(d.dataset.id);if(e){e.txt=t.innerText.replace(/\n$/,'');persist()}t.removeEventListener('blur',fim)};
 t.addEventListener('blur',fim);t.onkeydown=ev=>{if(ev.key==='Escape')t.blur()}}
function vazio(){const m=$('#qv-empty');if(m)m.style.display=els().length?'none':'flex'}

/* seleção, alças e mini-menu */
function select(id){
 if(sel){const o=dom(sel);if(o){o.classList.remove('sel');o.querySelectorAll('.qv-h,.qv-rot').forEach(x=>x.remove())}}
 sel=id;const m=$('#qv-menu');m.classList.remove('pal');
 if(id){const d=dom(id);d.classList.add('sel');['nw','ne','sw','se'].forEach(h=>{const i=document.createElement('i');i.className='qv-h';i.dataset.h=h;d.appendChild(i)});const r=document.createElement('i');r.className='qv-rot';d.appendChild(r)}
 posMenu()}
function posMenu(){const m=$('#qv-menu'),d=sel&&dom(sel);if(!m)return;if(!d){m.style.display='none';return}m.style.display='flex';
 const r=d.getBoundingClientRect(),v=VP().getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;
 let t=r.top-v.top-h-48;if(t<8)t=r.bottom-v.top+16;t=Math.max(8,Math.min(t,v.height-h-8));
 let l=r.left-v.left+r.width/2-w/2;l=Math.max(8,Math.min(l,v.width-w-8));m.style.top=t+'px';m.style.left=l+'px'}
function cor(c){const e=get(sel);if(!e)return;e.c=c;pl(dom(sel),e);persist()}
function ordem(dir){const e=get(sel);if(!e)return;const a=els().filter(x=>x!==e).sort((x,y)=>x.z-y.z);dir>0?a.push(e):a.unshift(e);a.forEach((x,i)=>{x.z=i+1;const n=dom(x.id);if(n)n.style.zIndex=x.z});persist()}
function dup(){const e=get(sel);if(!e)return;const n=JSON.parse(JSON.stringify(e));n.id=uid();n.x+=24;n.y+=24;n.z=top()+1;els().push(n);WD().appendChild(mk(n));select(n.id);persist()}
function apagar(){const e=get(sel);if(!e)return;const q=qd(ap());q.els=q.els.filter(x=>x!==e);const d=dom(sel);select(null);if(d)d.remove();vazio();persist()}

/* ===== VISÃO (pan/zoom infinito) ===== */
function av(init){const v=VP();WD().style.transform='translate('+V.x+'px,'+V.y+'px) scale('+V.s+')';v.style.setProperty('--inv',1/V.s);v.style.backgroundSize=24*V.s+'px '+24*V.s+'px';v.style.backgroundPosition=V.x+'px '+V.y+'px';$('#qv-zl').textContent=Math.round(V.s*100)+'%';posMenu();
 if(!init){clearTimeout(tv);tv=setTimeout(()=>{const p=ap();if(p){qd(p).view={x:V.x,y:V.y,s:V.s};persist()}},400)}}
function zoomAt(cx,cy,k){const r=VP().getBoundingClientRect(),ns=Math.max(.2,Math.min(3,V.s*k)),wx=(cx-r.left-V.x)/V.s,wy=(cy-r.top-V.y)/V.s;V.x=cx-r.left-wx*ns;V.y=cy-r.top-wy*ns;V.s=ns;av()}
function ajustar(){const a=els(),r=VP().getBoundingClientRect();if(!a.length){V={x:80,y:60,s:1};av();return}
 const x0=Math.min(...a.map(e=>e.x)),y0=Math.min(...a.map(e=>e.y)),x1=Math.max(...a.map(e=>e.x+e.w)),y1=Math.max(...a.map(e=>e.y+e.h)),s=Math.max(.2,Math.min(1.5,Math.min((r.width-120)/(x1-x0),(r.height-120)/(y1-y0))));
 V={s,x:r.width/2-((x0+x1)/2)*s,y:r.height/2-((y0+y1)/2)*s};av()}

/* ===== GESTOS ===== */
function gesto(mv,fin){const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);if(fin)fin();persist()};addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)}
function arrastar(ev){const e=get(sel),d=dom(sel),[x0,y0]=toWorld(ev.clientX,ev.clientY),ex=e.x,ey=e.y;gesto(m=>{const[x,y]=toWorld(m.clientX,m.clientY);e.x=ex+x-x0;e.y=ey+y-y0;pl(d,e);posMenu()})}
function pan(ev){const x0=ev.clientX,y0=ev.clientY,vx=V.x,vy=V.y;VP().classList.add('pan');gesto(m=>{V.x=vx+m.clientX-x0;V.y=vy+m.clientY-y0;av()},()=>VP().classList.remove('pan'))}
function resize(ev,h){const e=get(sel),d=dom(sel),hx=h.includes('e')?1:-1,hy=h.includes('s')?1:-1,rad=e.r*Math.PI/180,c=Math.cos(rad),s=Math.sin(rad),rot=(x,y)=>[x*c-y*s,x*s+y*c];
 const cx=e.x+e.w/2,cy=e.y+e.h/2,f=rot(-hx*e.w/2,-hy*e.h/2),F0=[cx+f[0],cy+f[1]],ratio=e.h/e.w,lock=e.t==='img';
 gesto(m=>{const[px,py]=toWorld(m.clientX,m.clientY),vx=px-F0[0],vy=py-F0[1],lx=vx*c+vy*s,ly=-vx*s+vy*c;
  let w=Math.max(MIN,lx*hx),hh=Math.max(MIN,ly*hy);if(lock)hh=Math.max(MIN*ratio,w*ratio);
  const o=rot(hx*w/2,hy*hh/2);e.w=w;e.h=hh;e.x=F0[0]+o[0]-w/2;e.y=F0[1]+o[1]-hh/2;pl(d,e);posMenu()})}
function rotar(ev){const e=get(sel),d=dom(sel),r=VP().getBoundingClientRect(),sx=r.left+V.x+(e.x+e.w/2)*V.s,sy=r.top+V.y+(e.y+e.h/2)*V.s;
 gesto(m=>{let a=Math.atan2(m.clientY-sy,m.clientX-sx)*180/Math.PI+90;if(m.shiftKey)a=Math.round(a/15)*15;e.r=Math.round(a*10)/10;pl(d,e);posMenu()})}

/* ===== IMAGEM (FileReader → Base64, reduzida para caber no localStorage) ===== */
function carregar(file){if(!file)return;const rd=new FileReader();
 rd.onload=()=>{const im=new Image();
  im.onload=()=>{const keep=/png|webp|gif/.test(file.type),mx=keep?1000:1400,k=Math.min(1,mx/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement('canvas');
   cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
   let src=cv.toDataURL(keep?'image/png':'image/jpeg',.86);if(keep&&src.length>1.2e6)src=cv.toDataURL('image/jpeg',.82);
   const w=Math.min(360,im.naturalWidth);novo('img',{src,w,h:Math.round(w*im.naturalHeight/im.naturalWidth)})};
  im.onerror=()=>aviso('Não foi possível abrir essa imagem.');im.src=rd.result};
 rd.readAsDataURL(file)}

/* ===== TELA ===== */
function rBoard(){
 const p=ap(),el=$('#vw');if(!p){el.innerHTML='<div class="card empty">Nenhum projeto ainda. Crie o primeiro em “Novo projeto”.</div>';return}
 const q=qd(p);V={x:q.view.x,y:q.view.y,s:q.view.s||1};sel=null;
 const tb=(t,i,tip)=>'<button data-t="'+t+'" data-tip="'+tip+'" aria-label="'+tip+'">'+QI[i]+'</button>';
 el.innerHTML='<div class="qv-top"><h1>Quadro Visual</h1><select id="qv-pj" aria-label="Projeto" style="max-width:220px">'+P.map(x=>'<option value="'+x.id+'"'+(x.id===p.id?' selected':'')+'>'+esc(x.nome)+'</option>').join('')+'</select></div>'
 +'<div class="qv"><aside class="qv-tb">'+tb('nota','nota','Nota de texto')+tb('img','img','Upload de imagem')+'<i class="qv-sep"></i>'+tb('circulo','circ','Círculo')+tb('quadrado','quad','Quadrado')+'<i class="qv-sep"></i>'+tb('texto','texto','Título (texto)')+'</aside>'
 +'<div class="qv-vp" id="qv-vp"><div class="qv-w" id="qv-w"></div>'
 +'<div class="qv-empty" id="qv-empty"><h2>Seu quadro está em branco</h2><p>Use a barra à esquerda para adicionar notas, imagens, formas e títulos.</p></div>'

/* ===== TEXTURAS ===== */
const PC={};let OT=null;
function pat(col){if(PC[col])return PC[col];const t=document.createElement('canvas');t.width=t.height=96;const c=t.getContext('2d');c.fillStyle=col;c.fillRect(0,0,96,96);let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<260;i++){c.fillStyle=r()>.5?'rgba(255,255,255,.08)':'rgba(0,0,0,.08)';c.beginPath();c.arc(r()*96,r()*96,r()*3+.6,0,7);c.fill()}return PC[col]=c.createPattern(t,'repeat')}
function oceanPat(){if(OT)return OT;const t=document.createElement('canvas');t.width=t.height=120;const c=t.getContext('2d');c.strokeStyle='rgba(255,255,255,.1)';c.lineWidth=1.4;[[20,30],[75,60],[40,100],[100,15]].forEach(([x,y])=>{c.beginPath();c.moveTo(x-10,y);c.quadraticCurveTo(x-5,y-5,x,y);c.quadraticCurveTo(x+5,y+5,x+10,y);c.stroke()});return OT=c.createPattern(t,'repeat')}

/* ===== RENDER ===== */
function paintSeg(o,a,b){lc.lineCap=lc.lineJoin='round';lc.lineWidth=o.r;if(o.k==='oceano'){lc.globalCompositeOperation='destination-out';lc.strokeStyle='#000'}else{lc.globalCompositeOperation='source-over';lc.strokeStyle=pat(S.terr[o.k]||S.terr.grama)}lc.beginPath();lc.moveTo(a[0],a[1]);lc.lineTo(b[0]+.01,b[1]);lc.stroke();lc.globalCompositeOperation='source-over'}
function repaintLand(){lc.clearRect(0,0,m.w,m.h);m.ops.forEach(o=>{if(o.t==='s')for(let i=0;i<o.pts.length;i++)paintSeg(o,o.pts[Math.max(0,i-1)],o.pts[i])})}
function pth(c,p){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++)c.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);c.lineTo(p[p.length-1][0],p[p.length-1][1])}
function drawR(c,o){if(o.pts.length<2)return;c.lineCap=c.lineJoin='round';if(o.k==='rio'){pth(c,o.pts);c.strokeStyle=S.out;c.lineWidth=o.w+3;c.stroke();pth(c,o.pts);c.strokeStyle=S.rio;c.lineWidth=o.w;c.stroke()}else{pth(c,o.pts);c.strokeStyle='#6b4f2a';c.lineWidth=o.w;c.setLineDash([o.w*2,o.w*1.6]);c.stroke();c.setLineDash([])}}
function drawP(c,o){c.save();c.translate(o.x,o.y);c.rotate((o.r||0)*Math.PI/180);c.scale(o.f?-o.s:o.s,o.s);c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=5*o.s;c.shadowOffsetY=3*o.s;c.strokeStyle='rgba(32,24,16,.8)';c.lineWidth=1.3;c.lineJoin='round';STP[o.k][2](c);c.restore()}
function drawL(c,o){c.save();c.translate(o.x,o.y);c.rotate((o.r||0)*Math.PI/180);c.font="600 "+o.s+"px 'Playfair Display',Georgia,serif";c.textAlign='center';c.lineJoin='round';c.lineWidth=Math.max(3,o.s/6);c.strokeStyle='rgba(15,15,21,.8)';c.fillStyle='#F5F0E1';c.strokeText(o.txt,0,0);c.fillText(o.txt,0,0);c.restore()}
const bb=o=>o.t==='p'?{x:-34,y:-58,w:68,h:64}:{x:-Math.max(20,(o.txt||'').length*o.s*.29),y:-o.s,w:Math.max(40,(o.txt||'').length*o.s*.58),h:o.s*1.3};
function box(c,o){const b=bb(o),s=o.t==='p'?o.s:1,k=1/MS.V.s/s;c.save();c.translate(o.x,o.y);c.rotate((o.r||0)*Math.PI/180);c.scale(o.f?-s:s,s);c.strokeStyle='#D4AF37';c.lineWidth=2*k;c.setLineDash([6*k,4*k]);c.strokeRect(b.x,b.y,b.w,b.h);c.restore()}
function hit(o,x,y){const a=-(o.r||0)*Math.PI/180,dx=x-o.x,dy=y-o.y;let lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);if(o.t==='p'){lx/=(o.f?-o.s:o.s);ly/=o.s}const b=bb(o);return lx>=b.x&&lx<=b.x+b.w&&ly>=b.y&&ly<=b.y+b.h}
const rq=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;compose()})};
function compose(clean){if(!ctx||!m)return;const W=m.w,H=m.h,c=ctx;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;
 const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,S.o1);g.addColorStop(1,S.o2);c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle=oceanPat();c.fillRect(0,0,W,H);
 if(MS.lay.terreno){sc2.globalCompositeOperation='source-over';sc2.clearRect(0,0,W,H);sc2.drawImage(land,0,0);sc2.globalCompositeOperation='source-in';sc2.fillStyle=S.out;sc2.fillRect(0,0,W,H);sc2.globalCompositeOperation='source-over';
  c.save();c.shadowColor=S.halo;c.shadowBlur=34;c.shadowOffsetX=W+200;c.drawImage(sil,-(W+200),0);c.drawImage(sil,-(W+200),0);c.restore();
  [[-3,0],[3,0],[0,-3],[0,3],[-2,-2],[2,2],[-2,2],[2,-2]].forEach(d=>c.drawImage(sil,d[0],d[1]));c.drawImage(land,0,0);m.ops.forEach(o=>{if(o.t==='r')drawR(c,o)})}
 if(MS.lay.objetos)m.ops.forEach(o=>{if(o.t==='p')drawP(c,o)});if(MS.lay.rotulos)m.ops.forEach(o=>{if(o.t==='l')drawL(c,o)});

function undoBtns(){const u=$('#mk-un'),r=$('#mk-re');if(u)u.disabled=!m.ops.length;if(r)r.disabled=!MS.redo.length}
function tools(){document.querySelectorAll('#mk-rl [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===MS.tool));const v=$('#mk-vp');v.classList.toggle('hand',MS.tool==='mao');v.classList.toggle('cross',['pincel','borracha','rio','estrada'].includes(MS.tool))}

  if(d.terr){MS.terr=d.terr;panel()}else if(d.cat){MS.cat=d.cat;MS.q='';panel()}else if(d.st){MS.st=d.st;panel()}else if(d.lay){MS.lay[d.lay]=!MS.lay[d.lay];panel();compose()}

 button,.nav,.tk,.doc,.pc,.wb-c,.mk-cd{-webkit-tap-highlight-color:rgba(212,175,55,.18)}
}
</style>
<script>
/* Responsividade: mantém a aba ativa da barra inferior visível */
(function(){
 var nav=document.getElementById('nav');if(!nav)return;
 function mostrarAtiva(){
  var on=nav.querySelector('.nav.on');
  if(on&&on.scrollIntoView&&window.matchMedia('(max-width:820px)').matches){
   try{on.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
  }
 }
 nav.addEventListener('click',function(){setTimeout(mostrarAtiva,60)});
 window.addEventListener('load',function(){setTimeout(mostrarAtiva,200)});
 window.addEventListener('resize',function(){setTimeout(mostrarAtiva,100)});
})();
</script>
